<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf4"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>小水管家 · 妈妈版</title></head><body><div class="phone"><header class="header"><div class="face">水</div><div class="title"><b>小水管家</b><span>妈妈版 · 本机保存</span></div><span class="tag">可用预览</span></header><main>
<section id="home" class="screen active"><div class="hello"><h1>您好，今天我陪您。</h1><p>不用记很多事，备忘会替您收好。</p></div><div class="assistant"><strong>跟生活管家说</strong><p>WaterOS 助手对话接口暂未连接。备忘不受影响，可以正常使用。</p><button data-go="chat">查看连接状态</button></div><h2>我能帮您</h2><div class="grid"><button class="card" data-go="notes"><span class="emoji">📝</span><b>我的备忘</b><span>影视、股票交易、孩子成长和以后要用的资料</span></button><button class="card preview"><span class="emoji">💰</span><b>投资情况与操作</b><span>只读预览；不连接账户，不会交易</span><i class="status">暂未连接</i></button><button class="card preview"><span class="emoji">🛍️</span><b>购物与下单</b><span>功能说明；不会付款或下单</span><i class="status">暂未连接</i></button><button class="card preview"><span class="emoji">🧳</span><b>翻译与出行</b><span>叫车、预订和外部联系尚未接通</span><i class="status">暂未连接</i></button><button class="card preview"><span class="emoji">🔐</span><b>安全档案</b><span>不会把护照、密码保存在本机备忘</span><i class="status">暂未连接</i></button><button class="card preview"><span class="emoji">📅</span><b>日程与家人</b><span>只读说明；不会给家人发消息</span><i class="status">暂未连接</i></button></div></section>
<section id="notes" class="screen"><div class="pagehead"><button class="back" data-go="home" aria-label="返回首页">‹</button><div><h1>我的备忘</h1><span class="muted">按您自己的分类，直接找到以前记过的内容</span></div></div><div class="scope"><b>备忘能做什么</b><div class="muted">保存文字、照片和文件。资料只留在这台设备的浏览器中；请勿保存护照号码或密码。</div></div><form id="searchForm" class="search"><input id="search" aria-label="搜索备忘" placeholder="搜索：电影、演员、英语课文……"><button aria-label="搜索">⌕</button></form><div id="searchResults"></div><div id="categories" class="cats"></div><button id="newNote" class="primary">记一条新的备忘</button></section>
<section id="list" class="screen"><div class="pagehead"><button class="back" data-go="notes" aria-label="返回分类">‹</button><div><h1 id="listTitle"></h1><span id="listDesc" class="muted"></span></div></div><div id="noteList"></div><button id="newInCategory" class="primary">在这个分类记一条</button></section>
<section id="editor" class="screen"><div class="pagehead"><button class="back" id="editorBack" aria-label="取消编辑">‹</button><h1 id="editorTitle">新备忘</h1></div><form id="noteForm" class="form"><label for="category">放在哪个分类</label><select id="category" required></select><label for="noteTitle">标题</label><input id="noteTitle" maxlength="120" placeholder="例如：《无间道》的主要演员"><label for="body">内容</label><textarea id="body" maxlength="5000" placeholder="把以后想找的内容写在这里"></textarea><label for="attachment">照片或文件（可选）</label><input id="attachment" type="file" accept="image/*,.pdf,.txt" capture="environment"><div id="fileMeta" class="filemeta"></div><button class="primary" type="submit">保存备忘</button></form><div id="editActions" class="actions hidden"><button id="deleteNote" class="danger">删除</button></div></section>
<section id="chat" class="screen"><div class="pagehead"><button class="back" data-go="home" aria-label="返回首页">‹</button><h1>生活管家</h1></div><div class="assistant"><strong>暂未连接 WaterOS 助手</strong><p>当前 WaterOS 只有本机协调、投影和任务事件接口，没有面向浏览器且经过认证的对话接口，也没有跨域许可。这里不会假装回答您。</p></div><label for="chatInput">想问的问题</label><input id="chatInput" disabled placeholder="连接后可以在这里打字"><button class="primary" disabled>发送（暂不可用）</button></section>
</main><nav class="bottom"><button data-go="home">⌂<br>首页</button><button data-go="notes">📝<br>我的备忘</button></nav></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><script type="module" src="app.mjs"></script></body></html>
